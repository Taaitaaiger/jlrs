[package]
name = "julia-metadata"
version = "0.1.0"
authors = ["Thomas van Doornmalen <thomas.vandoornmalen@gmail.com>"]
description = """
Julia version metadata for jlrs
"""
documentation = "https://docs.rs/jlrs"
repository = "https://github.com/Taaitaaiger/jlrs"
readme = "README.md"
keywords = []
categories = []
license = "MIT"
edition = "2024"
rust-version = "1.97"

[features]
windows = []
docs = []
debug = []

[dependencies]

[build-dependencies]
find-julia = { path = "../find_julia", version = "0.2" }
jlrs-compat = { path = "../jlrs_compat", version = "0.2" }

[package.metadata.docs.rs]
features = ["docs"]
