[package]
name = "jlrs-macros"
version = "0.7.1"
authors = ["Thomas van Doornmalen <thomas.vandoornmalen@gmail.com>"]
description = """
jlrs-macros contains the custom derives offered by jlrs.
"""
documentation = "https://docs.rs/jlrs-macros"
repository = "https://github.com/Taaitaaiger/jlrs"
readme = "../../README.md"
keywords = ["Julia", "math", "mathematics", "bindings", "ffi"]
license = "MIT"
edition = "2024"
rust-version = "1.97"

[features]
default = []
windows = []

derive = ["proc-macro2"]
ccall = ["proc-macro2"]
docs = []
jl-docs = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1", optional = true, features = ["span-locations"] }
syn = { version = "3", features = ["full", "extra-traits", "printing"] }
quote = { version = "1" }
itertools = "0.15"
julia-metadata = { version = "0.1.0", path = "../build_utils/julia_metadata"}

[build-dependencies]
julia-metadata = { version = "0.1.0", path = "../build_utils/julia_metadata"}

[package.metadata.docs.rs]
features = ["ccall", "derive"]
