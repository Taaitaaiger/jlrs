name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
        allow-fail: [false]
        include:
          - rust: nightly
            os: ubuntu-latest
            allow-fail: true
          - rust: nightly
            os: macos-latest
            allow-fail: true

    continue-on-error: ${{ matrix.allow-fail }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Julia environment
        id: setup-julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Setup Rust
        uses:  dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install Julia deps
        run: |
          julia -e 'import Pkg; Pkg.add(url="https://github.com/Taaitaaiger/JlrsCore.jl", rev="0f1b7cba4eeedae260cb48374716f3cd551fc8c0"); Pkg.add("StaticArrays")'

      - name: Run tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          cargo test --features full --verbose
          cargo test --features full,static-cache --verbose
        env:
          JLRS_JULIA_DIR: "${{ steps.setup-julia.outputs.julia-bindir }}/.."
          LD_LIBRARY_PATH: "${{ steps.setup-julia.outputs.julia-bindir }}/../lib"

      - name: Run tests
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          cargo test --features full --verbose
          cargo test --features full,static-cache --verbose
        env:
          JLRS_JULIA_DIR: "${{ steps.setup-julia.outputs.julia-bindir }}/.."
          DYLD_LIBRARY_PATH: "${{ steps.setup-julia.outputs.julia-bindir }}/../lib"

