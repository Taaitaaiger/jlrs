name: Embedding tests
description: Set up Julia and Rust and run the embedding test suite

inputs:
  julia-version:
    description: Julia version to use
    required: false

  rust-toolchain:
    description: Rust toolchain to use
    required: true

  jlrs-core-revision:
    description: "JlrsCore revision to use"
    required: true

runs:
  using: composite
  steps:
    - name: Setup Julia
      id: setup-julia
      uses: julia-actions/setup-julia@v3
      with:
        version: ${{ inputs.julia-version }}

    # - uses: julia-actions/cache@v3

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Install Julia dependencies
      shell: bash
      run: |
        julia -e 'import Pkg; Pkg.add(url="https://github.com/Taaitaaiger/JlrsCore.jl", rev="${{ inputs.jlrs-core-revision }}"); Pkg.add("StaticArrays")'

    - name: Inspect Julia libunwind
      shell: bash
      run: |
        JULIA_PREFIX="$(dirname "$(dirname "$(which julia)")")"
        echo "Julia executable: $(which julia)"
        julia -e 'println(Sys.BINDIR)'
        julia -e 'println(Sys.MACHINE)'

        JULIA_BINDIR="$(julia -e 'print(Sys.BINDIR)')"
        JULIA_LIBDIR="$(cd "$JULIA_BINDIR/../lib" && pwd)"

        echo "Julia library directory: $JULIA_LIBDIR"
        ls -la "$JULIA_LIBDIR"/*unwind* || true
        find "$JULIA_BINDIR/.." -name '*unwind*' -print

    - name: Run tests
      shell: bash
      env:
        JLRS_JULIA_DIR: ${{ steps.setup-julia.outputs.julia-bindir }}/..
        LD_LIBRARY_PATH: ${{ steps.setup-julia.outputs.julia-bindir }}/../lib
        DYLD_LIBRARY_PATH: ${{ steps.setup-julia.outputs.julia-bindir }}/../lib
      run: |
        cargo test --features full --verbose

    - name: Inspect ccall executable
      shell: bash
      run: |
        EXE="$(find target/debug/examples -type f -name 'ccall-*' \
          ! -name '*.d' ! -name '*.rcgu.o' | while read f; do
            file "$f" | grep -q 'Mach-O.*executable' && echo "$f" && break
          done)"

        if [ -z "$EXE" ]; then
          echo "No compiled ccall executable found"
          find target/debug/examples -maxdepth 1 -name 'ccall-*' -print
          exit 1
        fi

        echo "Executable: $EXE"
        otool -L "$EXE"

        echo "Runtime paths:"
        otool -l "$EXE" | grep -A3 LC_RPATH || true

